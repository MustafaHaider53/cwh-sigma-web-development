<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font properties</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap" rel="stylesheet">


    <style>

        h1 {

            font-family: "Baloo Bhai 2", sans-serif;
        }

        p {
            font-family: Impact, Haettenschweiler,
                'Arial Narrow Bold', sans-serif;
            font-style: italic;
            /* font-weight: bold; */
            font-size: 20;
            /* line-height: 20; */
            letter-spacing: 20px;
        }
        h2{
            text-transform: capitalize;
            text-decoration: underline;
            text-decoration-color: rgb(202, 8, 8);
            text-decoration-thickness: 20px;
            width: 45px;
        }
        .lorem{
            border: 2px solid red;
            width: 145px;
            /* overflow: hidden; */
            word-break: break-all;
        }

    </style>
</head>

<body>
    <h1>this is h1</h1>
    <p>this is para</p>
    <h2>about fonts</h2>
    <p class="lorem">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Iste, possimus. Eaque nihil beatae excepturi dicta, hic ab, sequi nulla rem tempore harum eos commodi cupiditate. Repellendus amet temporibus maiores impedit.</p>
</body>

</html>
